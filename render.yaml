services:
  - type: web
    name: goynar-gontobbo-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://goynar-gontobbo-api.onrender.com
      - key: FRONTEND_URL
        value: https://goynargontobbo.com
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: aftabuddinahmad26@gmail.com
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: aftabuddinahmad26@gmail.com
      - key: MAIL_FROM_NAME
        value: Goynar Gontobbo
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: goynar-gontobbo-db
          property: connectionString
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: array
      - key: SESSION_ENCRYPT
        value: "false"
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr

databases:
  - name: goynar-gontobbo-db
    databaseName: goynar_gontobbo
    user: goynar_gontobbo
    plan: free
    region: singapore
